[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mjolnir"
version = "0.1.0"
description = "Mjolnir — vLLM on Jetson Thor (sm_110): a patched vLLM image, an FA4-native GEMV decode kernel, and a one-command serve / bench / verify CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Narandill" }]
keywords = ["vllm", "jetson", "thor", "fa4", "flash-attention", "gemv", "cuda", "sm110"]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
mjolnir = "mjolnir.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mjolnir"]
