# Workspace root (not published). The repo ships two independently
# versioned PyPI distributions:
#
#   src/mjolnir/      -> mjolnir-kernel   (import `mjolnir`: the decode kernel
#                                          + the vLLM `MJOLNIR` attention backend)
#   src/mjolnir-cli/  -> mjolnir-cli      (import `mjolnir_cli`: the `mjolnir`
#                                          command — serve / verify / bench / plot)
#
# `uv sync` installs both (editable) plus the dev tools; `uv run mjolnir ...`
# then runs the CLI from the checkout.

[project]
name = "mjolnir-workspace"
version = "0"
description = "Mjolnir monorepo root — not published (see src/mjolnir and src/mjolnir-cli)."
requires-python = ">=3.12"
dependencies = [
    "mjolnir-cli[plot]",
    "mjolnir-kernel",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/mjolnir", "src/mjolnir-cli"]

[tool.uv.sources]
mjolnir-cli = { workspace = true }
mjolnir-kernel = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The CuTe-DSL kernel follows CUTLASS/FlashAttention conventions: the DSL's
# typing star-import and the running log-sum-exp accumulator named `l`.
"src/mjolnir/mjolnir/t5_decode.py" = ["F403", "F405", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# The PR coverage comment (py-cov-action) maps instrumented files onto the
# PR's changed files, so recorded paths must be repo-relative — coverage.py
# defaults to absolute, which the action cannot match.
relative_files = true

# File-length ratchet: covered files may not exceed `limit` lines. Ceilings only
# go down; an entry is removed once its file is <= limit; see AGENTS.md.
[tool.mjolnir.file-length]
limit = 1000
include = ["*.py", "*.sh", "*.j2", "*.md"]
exempt = [
    "README.md",
    "docker/vllm-thor/README.md",
    "docs/kernel/*.md",
    "docs/cli.md",
    "assets/benchmarks/**",
    "docker/vllm-thor/patches/**",
]

[tool.mjolnir.file-length.grandfathered]
"src/mjolnir/mjolnir/t5_decode.py" = 2990
"src/mjolnir-cli/mjolnir_cli/cli.py" = 1482
"scripts/hw/setup-thor.sh" = 1287
"tests/kernel/test_runner.py" = 1081
