[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mjolnir"
version = "0.1.0"
description = "Mjolnir — vLLM on Jetson Thor (sm_110): a patched vLLM image, an FA4-native GEMV decode kernel, and a one-command serve / bench / verify CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
authors = [{ name = "Mieszko Syty", email = "mieszko@ms1design.pl" }]
keywords = ["vllm", "jetson", "thor", "fa4", "flash-attention", "gemv", "cuda", "sm110"]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/thor-arena/mjolnir"
Documentation = "https://github.com/thor-arena/mjolnir/tree/main/docs"
Repository = "https://github.com/thor-arena/mjolnir.git"
Issues = "https://github.com/thor-arena/mjolnir/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
mjolnir = "mjolnir.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mjolnir"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vfa-tree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
