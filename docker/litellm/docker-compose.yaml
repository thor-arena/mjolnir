# LiteLLM proxy stack: litellm + postgres (spend logs / UI) + redis (cache +
# routing). Imported from the thor stack's docker/litellm.yaml, adapted for
# mjolnir:
#
#   - driven by the `mjolnir litellm` CLI (docker compose under the hood)
#   - config is rendered per-run by `mjolnir litellm up` from the user's
#     template in the litellm data dir ($MAIN_LLM_MODEL = the active mjolnir
#     model/config) -> ${LITELLM_DATA_DIR}/litellm_config.yaml
#   - the vLLM server is reached via host.docker.internal (host-gateway) —
#     the proxy works whether mjolnir's vLLM container is up or down, and
#     never shares a network with it
#   - data (postgres + redis) lives under ${LITELLM_DATA_DIR}
#     (default ~/.local/share/mjolnir/litellm)
#
# All ${...} are interpolated at `docker compose` time; the values come from
# the user's env file ($MJOLNIR_LITELLM_ENV, default
# ~/.local/share/mjolnir/litellm/litellm.env) with the :-defaults below as
# fallback.

services:
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG:-v1.100.0}
    restart: unless-stopped
    init: true
    ports:
      - "${LITELLM_PORT:-8000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DO_NOT_TRACK: 1
      PYTHONUNBUFFERED: 1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER:-postgres}:${LITELLM_POSTGRES_PASSWORD:-postgres}@litellm_db:${LITELLM_POSTGRES_PORT:-5432}/${LITELLM_POSTGRES_DB:-postgres}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-admin}
      # litellm_settings.cache: redis + router_settings.redis_* resolve these
      # os.environ/LITELLM_REDIS_* lookups inside the rendered config
      LITELLM_REDIS_HOST: ${LITELLM_REDIS_HOST:-litellm_redis}
      LITELLM_REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      LITELLM_REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:-redis}
      REDIS_HOST: ${LITELLM_REDIS_HOST:-litellm_redis}
      REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:-redis}
      LITELLM_LOCAL_MODEL_COST_MAP: "False"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:6001/v1}
      LITELLM_LOG: INFO
    volumes:
      - ${LITELLM_DATA_DIR}/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    depends_on:
      litellm_db:
        condition: service_healthy
      litellm_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  litellm_db:
    image: postgres:16.1
    hostname: litellm_db
    restart: unless-stopped
    expose:
      - "${LITELLM_POSTGRES_PORT:-5432}/tcp"
    environment:
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: ${LITELLM_POSTGRES_PORT:-5432}
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-postgres}
    volumes:
      - ${LITELLM_DATA_DIR}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_POSTGRES_USER:-postgres} -d ${LITELLM_POSTGRES_DB:-postgres} -h localhost -p ${LITELLM_POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  litellm_redis:
    image: redis/redis-stack:latest
    hostname: litellm_redis
    restart: unless-stopped
    expose:
      - 6379/tcp
    environment:
      REDIS_HOST: ${LITELLM_REDIS_HOST:-litellm_redis}
      REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      REDIS_SSL: "False"
      REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:-redis}
      REDIS_ARGS: "--requirepass ${LITELLM_REDIS_PASSWORD:-redis}"
    volumes:
      - ${LITELLM_DATA_DIR}/redis:/root/redis
    # (the thor stack's bare `redis-cli incr ping` healthcheck is vacuous:
    # redis-cli exits 0 on NOAUTH, so it "passed" even unauthenticated)
    # $$ is compose's escape: the password expands in the container shell,
    # where REDIS_PASSWORD is set (compose itself never sees its value)
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --raw incr ping 2>/dev/null | grep -qE '^[0-9]+$'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
