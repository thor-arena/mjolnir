<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#131A24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFB224" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFB224" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#F0883E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- faint hammer watermark, right side -->
  <g transform="translate(930,20) scale(2.6)" opacity="0.10">
    <line x1="59" y1="66" x2="47" y2="106" stroke="#E6EDF3" stroke-width="14" stroke-linecap="round"/>
    <path d="M36 20 H84 L98 34 V54 L84 68 H36 L22 54 V34 Z" fill="none" stroke="#E6EDF3" stroke-width="3"/>
    <path d="M63 12 L46 42 H57 L42 76 L76 36 H62 L74 12 Z" fill="none" stroke="#E6EDF3" stroke-width="2.5"/>
  </g>

  <!-- logo -->
  <g transform="translate(70,78) scale(1.15)">
    <line x1="59" y1="66" x2="47" y2="106" stroke="#2A2F3A" stroke-width="14" stroke-linecap="round"/>
    <line x1="59" y1="66" x2="47" y2="106" stroke="#8B949E" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M36 20 H84 L98 34 V54 L84 68 H36 L22 54 V34 Z" fill="url(#head)"/>
    <path d="M63 12 L46 42 H57 L42 76 L76 36 H62 L74 12 Z" fill="#0D1117"/>
    <circle cx="90" cy="14" r="2.4" fill="#FFC857"/>
    <circle cx="99" cy="24" r="1.6" fill="#FFC857" opacity="0.7"/>
  </g>

  <!-- wordmark -->
  <text x="230" y="165" font-size="86" font-weight="800" fill="#E6EDF3" letter-spacing="6">MJOLNIR</text>
  <rect x="232" y="184" width="520" height="5" rx="2.5" fill="url(#head)"/>
  <text x="234" y="232" font-size="27" fill="#8B949E" letter-spacing="0.5">the hammer that turns Jetson AGX Thor into a high-throughput LLM box</text>

  <!-- chips -->
  <g font-size="21" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace">
    <rect x="232" y="262" width="172" height="42" rx="21" fill="#151B26" stroke="#21262D"/>
    <text x="318" y="290" fill="#FFB224" text-anchor="middle">vLLM · sm_110a</text>
    <rect x="418" y="262" width="238" height="42" rx="21" fill="#151B26" stroke="#21262D"/>
    <text x="537" y="290" fill="#2DD4BF" text-anchor="middle">FA4-native GEMV kernel</text>
    <rect x="670" y="262" width="220" height="42" rx="21" fill="#151B26" stroke="#21262D"/>
    <text x="780" y="290" fill="#7C93C4" text-anchor="middle">one-command bench</text>
  </g>

  <text x="1160" y="316" font-size="17" fill="#8B949E" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono',Consolas,monospace" opacity="0.8">Jetson AGX Thor · CC 11.0 · NVFP4 · FP8 KV</text>
</svg>
